name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run lint

      - name: Production source safety regression
        run: npx tsx tests/regression/production-source-safety-regression.mjs

      - name: Postcode regression
        run: npx tsx tests/regression/postcode-filter-regression.mjs

      - name: Free scanner redaction regression
        run: node tests/regression/free-scanner-redaction-regression.mjs

      - name: Lead quality regression
        run: npx tsx tests/regression/lead-engine-quality-regression.mjs

      - name: Find a Tender OCDS regression
        run: npm run test:fts

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Production runtime regression
        run: node tests/regression/production-runtime-regression.mjs
